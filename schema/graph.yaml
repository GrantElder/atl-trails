    from: n0
    to: n1
    undirected_id: u0
    name: St Elmo Ave
    objectId: 1466
    kind: road               # road | alley
    length_m: 95.1
    length_ft: 312.0
    length_mi: 0.0591
    vehicle_one_way: B       # B | F | T (from MSAG match)
    direction: along         # along | against digitizing / Shape coords
