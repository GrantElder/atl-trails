# Directed road graph (reference)
# Built in-browser by explore/graph.js after a boundary map query.
# Built from explore/mapping.html (Chattanooga Mapping stage).

meta:
  mode: walk                 # walk | drive
  snapMeters: 2
  built: "2026-10-24T00:00:00.000Z"
  note: >
    Walk: every undirected segment expands to two directed edges.
    Drive: OneWayCode F = along digitizing direction only, T = reverse only, B = both.
    vehicle_one_way is always kept as metadata.
    OPEN alleys are centerlined from ROW polygons, snapped to roads, kind=alley.

stats:
  nodes: 120
  undirected: 200
  directed: 400
  splits: 35
  oneWayVehicle: 3
  alleys: 12
  total_length_mi: 12.4

nodes:
